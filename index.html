<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Night of Glory | Official DP Generator</title>
  <meta name="description" content="Generate and download your official Night of Glory branded DP flyer. Upload, crop, and share directly to WhatsApp.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Local Cropper.js CSS -->
  <link rel="stylesheet" href="assets/cropper.min.css">

  <style>
    :root {
      --bg-dark: #050811;
      --bg-surface: #0a1020;
      --bg-card: rgba(14, 23, 44, 0.85);
      --gold-primary: #d4af37;
      --gold-light: #fbe591;
      --gold-dark: #a88220;
      --gold-gradient: linear-gradient(135deg, #fce99f 0%, #d4af37 50%, #aa8222 100%);
      --gold-border: rgba(212, 175, 55, 0.4);
      --accent-blue: #1e3a8a;
      --whatsapp-color: #25d366;
      --whatsapp-gradient: linear-gradient(135deg, #2fe675 0%, #20b857 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Ambient background gold glow */
    body::before {
      content: "";
      position: absolute;
      top: -15%;
      left: 15%;
      width: 70vw;
      height: 70vw;
      max-width: 500px;
      max-height: 500px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, rgba(5, 8, 17, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Main Flex App Shell (100% strictly non-scrollable) */
    .app-shell {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      padding: 0;
      margin: 0;
    }

    /* Compact Header */
    header {
      flex-shrink: 0;
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10, 16, 32, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
    }

    .brand-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-sparkle {
      color: var(--gold-primary);
      font-size: 1.1rem;
      animation: pulseSparkle 2.5s infinite ease-in-out;
    }

    @keyframes pulseSparkle {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.8)); }
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand-subtitle-badge {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.35);
      color: var(--gold-light);
      padding: 3px 8px;
      border-radius: 20px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-header-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: var(--gold-light);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-header-action:hover, .btn-header-action:active {
      background: rgba(212, 175, 55, 0.2);
      border-color: var(--gold-primary);
    }

    /* Main Center Area: Perfectly centered, dynamic aspect-ratio flyer */
    main {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      position: relative;
    }

    .flyer-wrapper {
      position: relative;
      width: min(calc(100vw - 24px), calc((100dvh - 165px) * 1080 / 1350));
      height: min(calc(100dvh - 165px), calc((100vw - 24px) * 1350 / 1080));
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 1080 / 1350;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.2);
      border-radius: 14px;
      overflow: hidden;
      border: 1.5px solid rgba(212, 175, 55, 0.4);
      background: #070c18;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      pointer-events: none;
    }

    /* Tappable Photo Area Hotspot */
    #photoHotspot {
      position: absolute;
      /* Default Standard Window coordinates in percentages:
         x: 288/1080 = 26.666%, y: 215/1350 = 15.926%,
         w: 503/1080 = 46.574%, h: 466/1350 = 34.518% */
      left: 26.666%;
      top: 15.926%;
      width: 46.574%;
      height: 34.518%;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 10px;
      border-radius: 6px;
      z-index: 10;
      transition: all 0.25s ease;
    }

    #photoHotspot.full-mode {
      /* Full window mode: h: 614/1350 = 45.481% */
      height: 45.481%;
    }

    /* Tap hint badge on flyer photo */
    .tap-hint-pill {
      background: rgba(7, 12, 24, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--gold-primary);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6), 0 0 12px rgba(212, 175, 55, 0.35);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      pointer-events: none;
      animation: gentleBounce 3s infinite ease-in-out;
      transform-origin: center bottom;
    }

    .tap-hint-pill svg {
      color: var(--gold-light);
    }

    @keyframes gentleBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    #photoHotspot:hover .tap-hint-pill,
    #photoHotspot:active .tap-hint-pill {
      background: rgba(212, 175, 55, 0.95);
      color: #070c18;
      border-color: #fff;
    }

    #photoHotspot:hover .tap-hint-pill svg,
    #photoHotspot:active .tap-hint-pill svg {
      color: #070c18;
    }

    /* Bottom Action Controls Bar */
    footer.bottom-bar {
      flex-shrink: 0;
      padding: 8px 12px 10px;
      background: rgba(10, 16, 32, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(212, 175, 55, 0.25);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 20;
    }

    /* Primary Row: Upload Button prominent */
    .primary-action-row {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Secondary Action Row: Download & WhatsApp & Share */
    .secondary-action-row {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.84rem;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      padding: 10px 14px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
      white-space: nowrap;
      flex: 1;
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* Main Gold Upload Button */
    .btn-gold {
      background: var(--gold-gradient);
      color: #0a1120;
      box-shadow: 0 4px 16px rgba(212, 175, 55, 0.35);
      font-size: 0.92rem;
      font-weight: 800;
      padding: 11px 16px;
    }

    .btn-gold:hover {
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
      filter: brightness(1.05);
    }

    /* Download HD Button */
    .btn-download {
      background: rgba(22, 34, 56, 0.9);
      border: 1.5px solid rgba(212, 175, 55, 0.5);
      color: var(--gold-light);
    }

    .btn-download:hover {
      background: rgba(30, 48, 80, 0.9);
      border-color: var(--gold-light);
    }

    /* WhatsApp Button */
    .btn-whatsapp {
      background: var(--whatsapp-gradient);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.35);
    }

    .btn-whatsapp:hover {
      filter: brightness(1.06);
      box-shadow: 0 6px 18px rgba(37, 211, 102, 0.5);
    }

    /* Secondary Icon Button */
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      flex: 0 0 auto;
      padding: 10px 12px;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    /* Hidden File Input */
    #fileInput {
      display: none;
    }

    /* Fullscreen Modal: Cropper */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(3, 6, 14, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-header {
      flex-shrink: 0;
      height: 50px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      background: rgba(10, 16, 32, 0.9);
    }

    .modal-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--gold-light);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close-btn:hover {
      color: #fff;
    }

    /* Modal Center Body */
    .modal-body {
      flex: 1;
      min-height: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .cropper-container-box {
      width: 100%;
      height: 100%;
      max-width: 600px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.25);
    }

    #cropperImage {
      max-width: 100%;
      display: block;
    }

    /* Modal Toolbar */
    .modal-toolbar {
      flex-shrink: 0;
      padding: 8px 12px;
      background: rgba(10, 16, 32, 0.95);
      border-top: 1px solid rgba(212, 175, 55, 0.25);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toolbar-tools-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .aspect-pill-group {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .aspect-pill {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .aspect-pill.active {
      background: var(--gold-gradient);
      color: #091020;
      font-weight: 700;
    }

    .tool-icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .tool-icon-btn:hover {
      background: rgba(212, 175, 55, 0.25);
      border-color: var(--gold-primary);
    }

    .modal-action-row {
      display: flex;
      gap: 8px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    /* Small Modal / Popover for Name Editing */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      z-index: 110;
      background: rgba(3, 6, 14, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
    }

    .sheet-overlay.active {
      display: flex;
    }

    .sheet-card {
      background: #0d152a;
      border: 1.5px solid var(--gold-border);
      border-radius: 18px;
      width: 100%;
      max-width: 440px;
      padding: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(212, 175, 55, 0.25);
      animation: slideUpSheet 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUpSheet {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .sheet-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--gold-light);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .form-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
    }

    .form-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      top: 56px;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background: rgba(14, 23, 44, 0.96);
      border: 1.5px solid var(--gold-primary);
      color: #fff;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 16px rgba(212, 175, 55, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 200;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Hidden Photo Input -->
  <input type="file" id="fileInput" accept="image/*">

  <!-- Main App Shell -->
  <div class="app-shell">
    
    <!-- Top Header -->
    <header>
      <div class="brand-title-wrap">
        <span class="brand-sparkle">✦</span>
        <span class="brand-title">Night of Glory</span>
        <span class="brand-subtitle-badge">DP Creator</span>
      </div>

      <div class="header-actions">
        <button type="button" class="btn-header-action" id="btnOpenNameModal" title="Customize Name & Title">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
          Name
        </button>
      </div>
    </header>

    <!-- Center Flyer Display (Dynamic Aspect Ratio, 100% Non-Scrollable) -->
    <main>
      <div class="flyer-wrapper" id="flyerWrapper">
        <!-- Live HD Canvas -->
        <canvas id="renderCanvas" width="1080" height="1350"></canvas>

        <!-- Tappable Hotspot directly over photo frame window -->
        <div id="photoHotspot" title="Tap here to upload or change your photo">
          <div class="tap-hint-pill">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            <span>Tap to Change</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom Actions Bar (Fits cleanly above the fold) -->
    <footer class="bottom-bar">
      <!-- Primary Row: Big Upload Button -->
      <div class="primary-action-row">
        <button type="button" class="btn btn-gold" id="btnUploadPhoto">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
          Upload / Change Photo
        </button>
      </div>

      <!-- Secondary Row: Download HD & Share -->
      <div class="secondary-action-row">
        <button type="button" class="btn btn-download" id="btnDownload">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Download HD
        </button>

        <button type="button" class="btn btn-whatsapp" id="btnWhatsApp">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.311.045-.698.056-1.118-.082-.26-.086-.593-.198-1.01-.382-1.782-.786-2.937-2.607-3.027-2.727-.089-.12-1.724-2.296-1.724-4.38 0-2.085 1.085-3.109 1.472-3.535.387-.426.843-.533 1.127-.533.283 0 .567.004.814.015.263.012.614-.1.96.732.358.864 1.224 2.991 1.332 3.213.109.222.181.482.036.77-.145.289-.218.469-.434.723-.217.254-.455.568-.651.763-.217.216-.443.45-.19.885.253.435 1.127 1.862 2.42 3.013 1.666 1.484 3.069 1.944 3.504 2.161.434.218.687.182.94-.109.254-.29 1.085-1.266 1.374-1.7.289-.435.578-.362.976-.217.398.145 2.529 1.193 2.963 1.411.434.217.723.326.832.508.109.182.109 1.053-.035 1.458z"/></svg>
          WhatsApp
        </button>

        <button type="button" class="btn btn-secondary" id="btnShareNative" title="Share via other apps">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        </button>
      </div>
    </footer>

  </div>

  <!-- Fullscreen Cropper Modal Overlay -->
  <div class="modal-overlay" id="cropperModal">
    <div class="modal-header">
      <div class="modal-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2v14a2 2 0 0 0 2 2h14"></path><path d="M18 22V8a2 2 0 0 0-2-2H2"></path></svg>
        Crop & Adjust Photo
      </div>
      <button type="button" class="modal-close-btn" id="btnCloseCropper" title="Cancel">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="cropper-container-box">
        <img id="cropperImage" src="" alt="Photo to crop">
      </div>
    </div>

    <div class="modal-toolbar">
      <!-- Toolbar Tools -->
      <div class="toolbar-tools-row">
        <!-- Frame Aspect Ratio -->
        <div class="aspect-pill-group">
          <button type="button" class="aspect-pill active" id="btnCropModeStd">Standard</button>
          <button type="button" class="aspect-pill" id="btnCropModeFull">Full Frame</button>
        </div>

        <!-- Rotate & Zoom Tools -->
        <div style="display: flex; gap: 6px;">
          <button type="button" class="tool-icon-btn" id="btnRotateLeft" title="Rotate Left">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
          </button>
          <button type="button" class="tool-icon-btn" id="btnRotateRight" title="Rotate Right">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
          </button>
          <button type="button" class="tool-icon-btn" id="btnFlipH" title="Flip Horizontal">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="7 8 3 12 7 16"></polyline><polyline points="17 8 21 12 17 16"></polyline><line x1="12" y1="4" x2="12" y2="20"></line></svg>
          </button>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="modal-action-row">
        <button type="button" class="btn btn-secondary" id="btnCancelCrop" style="flex: 0 0 90px;">Cancel</button>
        <button type="button" class="btn btn-gold" id="btnApplyCrop">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
          Apply to Flyer
        </button>
      </div>
    </div>
  </div>

  <!-- Name / Badge Customization Sheet -->
  <div class="sheet-overlay" id="nameSheetModal">
    <div class="sheet-card">
      <div class="sheet-header">
        <div class="sheet-title">Customize Name on Flyer</div>
        <button type="button" class="modal-close-btn" id="btnCloseNameSheet">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <div class="form-toggle-row">
        <span style="font-size: 0.8rem; font-weight: 600;">Show Custom Name on Badge</span>
        <input type="checkbox" id="toggleNameBadge" style="width: 18px; height: 18px; accent-color: var(--gold-primary); cursor: pointer;">
      </div>

      <div id="nameFieldsGroup">
        <div class="form-group">
          <label class="form-label" for="inputName">Your Full Name</label>
          <input type="text" id="inputName" class="form-input" placeholder="e.g. Dr. Alex Vance" maxlength="32">
        </div>

        <div class="form-group">
          <label class="form-label" for="inputTitle">Title / Role</label>
          <input type="text" id="inputTitle" class="form-input" placeholder="e.g. SPECIAL GUEST" maxlength="32">
        </div>
      </div>

      <button type="button" class="btn btn-gold" id="btnSaveNameSheet" style="width: 100%; margin-top: 6px;">
        Update Flyer
      </button>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast">
    <span id="toastIcon">✓</span>
    <span id="toastMsg">Ready</span>
  </div>

  <!-- Cropper.js Local Script -->
  <script src="assets/cropper.min.js"></script>

  <script>
    // --- Canvas Dimensions & Flyer Coordinates ---
    const CANVAS_WIDTH = 1080;
    const CANVAS_HEIGHT = 1350;

    // Standard Window: photo sits in white box, name badge stays below
    // x: 288, y: 215, width: 503, height: 466
    const STD_BOX = {
      x: 288,
      y: 215,
      width: 503,
      height: 466,
      aspectRatio: 503 / 466 // ~1.079
    };

    // Full Window: photo spans through badge area down to bottom border
    // x: 288, y: 215, width: 503, height: 614
    const FULL_BOX = {
      x: 288,
      y: 215,
      width: 503,
      height: 614,
      aspectRatio: 503 / 614 // ~0.819
    };

    // Badge coordinates for custom name rendering:
    // x: 288, y: 691, width: 503, height: 139
    const BADGE_BOX = {
      x: 288,
      y: 691,
      width: 503,
      height: 139
    };

    // State
    let currentMode = 'std'; // 'std' or 'full'
    let cropper = null;
    let flipH = 1;
    let activeCroppedCanvas = null; // Stored cropped canvas

    // Preloaded Overlays
    const overlayStd = new Image();
    overlayStd.src = 'assets/frame-overlay-std.png';

    const overlayFull = new Image();
    overlayFull.src = 'assets/frame-overlay-full.png';

    // Sample Demo Image
    const sampleImage = new Image();
    sampleImage.src = 'assets/demo-sample.jpg';

    // DOM Elements
    const renderCanvas = document.getElementById('renderCanvas');
    const ctx = renderCanvas.getContext('2d');
    const photoHotspot = document.getElementById('photoHotspot');
    const fileInput = document.getElementById('fileInput');

    const btnUploadPhoto = document.getElementById('btnUploadPhoto');
    const btnDownload = document.getElementById('btnDownload');
    const btnWhatsApp = document.getElementById('btnWhatsApp');
    const btnShareNative = document.getElementById('btnShareNative');

    // Cropper Modal Elements
    const cropperModal = document.getElementById('cropperModal');
    const cropperImage = document.getElementById('cropperImage');
    const btnCloseCropper = document.getElementById('btnCloseCropper');
    const btnCancelCrop = document.getElementById('btnCancelCrop');
    const btnApplyCrop = document.getElementById('btnApplyCrop');
    const btnCropModeStd = document.getElementById('btnCropModeStd');
    const btnCropModeFull = document.getElementById('btnCropModeFull');
    const btnRotateLeft = document.getElementById('btnRotateLeft');
    const btnRotateRight = document.getElementById('btnRotateRight');
    const btnFlipH = document.getElementById('btnFlipH');

    // Name Customization Modal Elements
    const nameSheetModal = document.getElementById('nameSheetModal');
    const btnOpenNameModal = document.getElementById('btnOpenNameModal');
    const btnCloseNameSheet = document.getElementById('btnCloseNameSheet');
    const btnSaveNameSheet = document.getElementById('btnSaveNameSheet');
    const toggleNameBadge = document.getElementById('toggleNameBadge');
    const inputName = document.getElementById('inputName');
    const inputTitle = document.getElementById('inputTitle');

    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    const toastIcon = document.getElementById('toastIcon');

    // Show Toast
    function showToast(msg, icon = '✓', duration = 2500) {
      toastIcon.textContent = icon;
      toastMsg.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, duration);
    }

    // Helper: Draw image with cover scaling to avoid stretching
    function drawCoverImage(ctx, img, x, y, w, h) {
      const imgRatio = (img.naturalWidth || img.width) / (img.naturalHeight || img.height);
      const targetRatio = w / h;
      let sx, sy, sw, sh;
      if (imgRatio > targetRatio) {
        sh = img.naturalHeight || img.height;
        sw = sh * targetRatio;
        sx = ((img.naturalWidth || img.width) - sw) / 2;
        sy = 0;
      } else {
        sw = img.naturalWidth || img.width;
        sh = sw / targetRatio;
        sx = 0;
        sy = ((img.naturalHeight || img.height) - sh) / 2;
      }
      ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
    }

    // Initialize Default State
    function initDefaultState() {
      renderCanvas.width = CANVAS_WIDTH;
      renderCanvas.height = CANVAS_HEIGHT;

      const triggerRender = () => {
        renderFlyerComposite();
      };

      if (!overlayStd.complete) overlayStd.addEventListener('load', triggerRender);
      if (!sampleImage.complete) sampleImage.addEventListener('load', triggerRender);
      if (!overlayFull.complete) overlayFull.addEventListener('load', triggerRender);

      // Render initial state
      triggerRender();

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(triggerRender);
      }
    }

    // Main Composite Drawing Pipeline
    function renderFlyerComposite() {
      // 1. Clear & Dark Background
      ctx.fillStyle = '#070c18';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      const targetBox = currentMode === 'full' ? FULL_BOX : STD_BOX;
      const bleed = 2; // Bleed under frame border

      // 2. Draw Photo (either user cropped photo, or default sample image)
      if (activeCroppedCanvas) {
        ctx.drawImage(
          activeCroppedCanvas,
          targetBox.x - bleed,
          targetBox.y - bleed,
          targetBox.width + bleed * 2,
          targetBox.height + bleed * 2
        );
      } else if (sampleImage.complete && sampleImage.naturalWidth > 0) {
        // Draw sample photo centered with cover aspect ratio into targetBox
        drawCoverImage(
          ctx,
          sampleImage,
          targetBox.x - bleed,
          targetBox.y - bleed,
          targetBox.width + bleed * 2,
          targetBox.height + bleed * 2
        );
      }

      // 3. Draw Overlay Frame over photo
      const overlay = currentMode === 'full' ? overlayFull : overlayStd;
      if (overlay.complete && overlay.naturalWidth > 0) {
        ctx.drawImage(overlay, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      }

      // 4. Custom Name Badge (if active and in standard mode)
      if (toggleNameBadge.checked && currentMode === 'std') {
        drawCustomNameBadge();
      }
    }

    // Custom Name Badge Rendering
    function drawCustomNameBadge() {
      const name = (inputName.value || 'GUEST NAME').trim().toUpperCase();
      const title = (inputTitle.value || 'ATTENDEE').trim().toUpperCase();

      const bx = BADGE_BOX.x;
      const by = BADGE_BOX.y;
      const bw = BADGE_BOX.width;
      const bh = BADGE_BOX.height;

      // Navy gradient background
      const grad = ctx.createLinearGradient(bx, by, bx, by + bh);
      grad.addColorStop(0, '#091642');
      grad.addColorStop(0.5, '#0b1d56');
      grad.addColorStop(1, '#071238');

      ctx.fillStyle = grad;
      ctx.fillRect(bx, by, bw, bh);

      // Gold divider line
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(bx + 40, by + bh * 0.58);
      ctx.lineTo(bx + bw - 40, by + bh * 0.58);
      ctx.stroke();

      // Name Text
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      let fontSize = 34;
      ctx.font = `800 ${fontSize}px 'Montserrat', sans-serif`;
      while (ctx.measureText(name).width > (bw - 40) && fontSize > 16) {
        fontSize -= 2;
        ctx.font = `800 ${fontSize}px 'Montserrat', sans-serif`;
      }

      ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
      ctx.shadowBlur = 6;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 2;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(name, bx + bw / 2, by + bh * 0.32);

      // Title Text
      ctx.shadowBlur = 4;
      ctx.font = `700 17px 'Montserrat', sans-serif`;
      ctx.fillStyle = '#d4af37';
      ctx.fillText(title, bx + bw / 2, by + bh * 0.78);

      ctx.shadowColor = 'transparent';
    }

    // Open Cropper with selected image
    function openCropper(imageSrc) {
      cropperImage.src = imageSrc;
      cropperModal.classList.add('active');

      if (cropper) {
        cropper.destroy();
      }

      const ratio = currentMode === 'full' ? FULL_BOX.aspectRatio : STD_BOX.aspectRatio;
      flipH = 1;

      cropper = new Cropper(cropperImage, {
        aspectRatio: ratio,
        viewMode: 1,
        dragMode: 'move',
        autoCropArea: 0.95,
        restore: false,
        guides: true,
        center: true,
        highlight: false,
        cropBoxMovable: true,
        cropBoxResizable: true,
        toggleDragModeOnDblclick: false,
        ready() {
          showToast('Adjust position & crop your photo', '✂️');
        }
      });
    }

    function closeCropperModal() {
      cropperModal.classList.remove('active');
      if (cropper) {
        cropper.destroy();
        cropper = null;
      }
    }

    // File selection handler
    function handleSelectedFile(file) {
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showToast('Please choose an image file (JPG, PNG, WEBP)', '⚠️');
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        openCropper(e.target.result);
      };
      reader.readAsDataURL(file);
    }

    // Event: Tap Photo Hotspot or Upload Button triggers File Picker
    photoHotspot.addEventListener('click', () => fileInput.click());
    btnUploadPhoto.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        handleSelectedFile(e.target.files[0]);
        // Reset input value so same photo can be re-selected if desired
        fileInput.value = '';
      }
    });

    // Cropper Toolbar Controls
    btnRotateLeft.addEventListener('click', () => cropper && cropper.rotate(-90));
    btnRotateRight.addEventListener('click', () => cropper && cropper.rotate(90));
    btnFlipH.addEventListener('click', () => {
      if (!cropper) return;
      flipH = -flipH;
      cropper.scaleX(flipH);
    });

    // Aspect ratio modes in Cropper
    function setCropperMode(mode) {
      currentMode = mode;
      btnCropModeStd.classList.toggle('active', mode === 'std');
      btnCropModeFull.classList.toggle('active', mode === 'full');
      photoHotspot.classList.toggle('full-mode', mode === 'full');

      if (cropper) {
        const ratio = mode === 'full' ? FULL_BOX.aspectRatio : STD_BOX.aspectRatio;
        cropper.setAspectRatio(ratio);
      }
    }

    btnCropModeStd.addEventListener('click', () => setCropperMode('std'));
    btnCropModeFull.addEventListener('click', () => setCropperMode('full'));

    // Apply Crop
    btnApplyCrop.addEventListener('click', () => {
      if (!cropper) return;
      try {
        activeCroppedCanvas = cropper.getCroppedCanvas({
          imageSmoothingEnabled: true,
          imageSmoothingQuality: 'high'
        });
        renderFlyerComposite();
        closeCropperModal();
        showToast('Flyer updated! Ready to share or download', '🎉');
      } catch (err) {
        console.error('Crop extraction failed:', err);
        showToast('Failed to crop photo. Try again.', '⚠️');
      }
    });

    btnCloseCropper.addEventListener('click', closeCropperModal);
    btnCancelCrop.addEventListener('click', closeCropperModal);

    // Name Customization Modal Handlers
    btnOpenNameModal.addEventListener('click', () => {
      nameSheetModal.classList.add('active');
    });

    btnCloseNameSheet.addEventListener('click', () => {
      nameSheetModal.classList.remove('active');
    });

    btnSaveNameSheet.addEventListener('click', () => {
      nameSheetModal.classList.remove('active');
      renderFlyerComposite();
      showToast('Name badge updated!', '✓');
    });

    toggleNameBadge.addEventListener('change', () => {
      renderFlyerComposite();
    });

    inputName.addEventListener('input', () => {
      if (toggleNameBadge.checked) renderFlyerComposite();
    });

    inputTitle.addEventListener('input', () => {
      if (toggleNameBadge.checked) renderFlyerComposite();
    });

    // Get HD Blob from Canvas
    function getCanvasBlob(format = 'image/jpeg', quality = 0.95) {
      return new Promise((resolve) => {
        renderCanvas.toBlob((blob) => {
          resolve(blob);
        }, format, quality);
      });
    }

    // 1. Download HD Action
    btnDownload.addEventListener('click', async () => {
      showToast('Preparing your HD Flyer...', '⏳');
      const blob = await getCanvasBlob('image/jpeg', 0.96);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Night_of_Glory_DP_${Date.now()}.jpg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      showToast('Download started!', '🎉');
    });

    // 2. WhatsApp Direct Action
    btnWhatsApp.addEventListener('click', async () => {
      showToast('Preparing WhatsApp Share...', '⏳');
      const blob = await getCanvasBlob('image/jpeg', 0.95);
      const file = new File([blob], 'Night_of_Glory_DP.jpg', { type: 'image/jpeg' });

      // Check if Web Share API with files is supported
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'Night of Glory DP',
            text: 'I will be at Night of Glory! Create yours too.'
          });
          showToast('Shared successfully!', '🎉');
          return;
        } catch (err) {
          if (err.name !== 'AbortError') {
            console.warn('Native share failed, downloading fallback:', err);
          } else {
            return; // User canceled
          }
        }
      }

      // Fallback: download the file & open WhatsApp
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Night_of_Glory_DP.jpg';
      a.click();

      const waText = encodeURIComponent("I will be at Night of Glory! Here is my official DP.");
      window.open(`https://api.whatsapp.com/send?text=${waText}`, '_blank');
      showToast('Flyer downloaded! Pick it in WhatsApp.', '📱');
    });

    // 3. Native Share Everywhere Action
    btnShareNative.addEventListener('click', async () => {
      const blob = await getCanvasBlob('image/jpeg', 0.95);
      const file = new File([blob], 'Night_of_Glory_DP.jpg', { type: 'image/jpeg' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'Night of Glory DP',
            text: 'I will be at Night of Glory!'
          });
          showToast('Shared successfully!', '🎉');
        } catch (err) {
          if (err.name !== 'AbortError') {
            showToast('Share canceled or not supported.', 'ℹ️');
          }
        }
      } else {
        btnDownload.click();
        showToast('Downloaded! Direct sharing not supported on this browser.', 'ℹ️');
      }
    });

    // Start on DOM ready
    window.addEventListener('DOMContentLoaded', initDefaultState);
  </script>
</body>
</html>
