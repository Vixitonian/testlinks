<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notepad</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f5f0;
    --sidebar-bg: #eeeee8;
    --sidebar-border: #d8d8d0;
    --card-hover: #e8e8e2;
    --card-active: #dce4ff;
    --accent: #4a6cf7;
    --accent-dark: #3355d4;
    --danger: #e55;
    --text: #222;
    --muted: #888;
    --title-border: #e0e0e0;
    --radius: 8px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: 280px;
    min-width: 220px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--sidebar-border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  #sidebar-header {
    padding: 16px 14px 12px;
    border-bottom: 1px solid var(--sidebar-border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #sidebar-header h1 {
    font-size: 16px;
    font-weight: 700;
    flex: 1;
  }

  #btn-new {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s;
  }
  #btn-new:hover { background: var(--accent-dark); }

  #notes-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 6px;
  }

  .note-item {
    padding: 12px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background .12s;
    margin-bottom: 2px;
  }
  .note-item:hover  { background: var(--card-hover); }
  .note-item.active { background: var(--card-active); }

  .note-item-title {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .note-item-date {
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
  }

  #empty-state {
    padding: 40px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
  }

  /* ── Editor ── */
  #editor-pane {
    flex: 1;
    display: none;
    flex-direction: column;
    background: #fff;
    overflow: hidden;
  }

  #editor-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--title-border);
  }

  #btn-back {
    display: none;
    background: transparent;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: var(--accent);
    padding: 0 4px;
    line-height: 1;
  }

  #title-input {
    flex: 1;
    font-size: 16px;
    font-weight: 700;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-family: var(--font);
    min-width: 0;
  }
  #title-input::placeholder { color: #bbb; }

  #btn-save {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #btn-save:hover    { background: var(--accent-dark); }
  #btn-save:disabled { background: #aac; cursor: default; }

  #btn-delete {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, color .15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #btn-delete:hover { background: var(--danger); color: #fff; }

  #content-textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    padding: 20px 16px;
    font-size: 15px;
    line-height: 1.75;
    font-family: var(--font);
    color: var(--text);
    background: transparent;
  }
  #content-textarea::placeholder { color: #ccc; }

  /* ── Placeholder (desktop only) ── */
  #placeholder-pane {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 15px;
    flex-direction: column;
    gap: 12px;
  }
  #placeholder-pane svg { opacity: .2; }

  /* ── Status toast ── */
  #status-bar {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    font-size: 13px;
    padding: 8px 18px;
    border-radius: 20px;
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
    white-space: nowrap;
  }
  #status-bar.show { opacity: 1; }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    #sidebar {
      width: 100%;
      min-width: 0;
      border-right: none;
    }

    /* When editor is active on mobile, hide sidebar and show editor */
    body.show-editor #sidebar       { display: none; }
    body.show-editor #placeholder-pane { display: none; }
    body.show-editor #editor-pane   { display: flex; width: 100%; }

    /* Back button visible on mobile only */
    #btn-back { display: block; }

    /* Hide placeholder pane on mobile (no side-by-side) */
    #placeholder-pane { display: none; }
  }

  /* ── Desktop default ── */
  @media (min-width: 601px) {
    #editor-pane { display: none; }  /* toggled via JS */
    #btn-back    { display: none !important; }
  }
</style>
</head>
<body>

<aside id="sidebar">
  <div id="sidebar-header">
    <h1>📝 Notepad</h1>
    <button id="btn-new">+ New</button>
  </div>
  <div id="notes-list">
    <div id="empty-state">No notes yet.<br>Tap <strong>+ New</strong> to create one.</div>
  </div>
</aside>

<main id="editor-pane">
  <div id="editor-toolbar">
    <button id="btn-back" aria-label="Back">‹</button>
    <input id="title-input" type="text" placeholder="Note title…" maxlength="255">
    <button id="btn-save">Save</button>
    <button id="btn-delete">Delete</button>
  </div>
  <textarea id="content-textarea" placeholder="Start writing…"></textarea>
</main>

<div id="placeholder-pane">
  <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
  </svg>
  <span>Select a note or create a new one</span>
</div>

<div id="status-bar"></div>

<script>
const SB_URL = 'http://supabein.dxinnovationhub.com/api/v1';
const SB_KEY = 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmVpbiIsInR5cGUiOiJhbm9uIiwicGlkIjoyfQ.nZw9YRk93LoFGFx1Na5Hzef_L7_AXh_FZKro7a7B9jA';
const SB_PID = 2;

let notes = [];
let activeId = null;

const sidebar        = document.getElementById('sidebar');
const notesList      = document.getElementById('notes-list');
const editorPane     = document.getElementById('editor-pane');
const placeholderPane= document.getElementById('placeholder-pane');
const titleInput     = document.getElementById('title-input');
const contentArea    = document.getElementById('content-textarea');
const btnSave        = document.getElementById('btn-save');
const btnDelete      = document.getElementById('btn-delete');
const btnNew         = document.getElementById('btn-new');
const btnBack        = document.getElementById('btn-back');
const statusBar      = document.getElementById('status-bar');

const isMobile = () => window.innerWidth <= 600;

let statusTimer;
function showStatus(msg) {
  statusBar.textContent = msg;
  statusBar.classList.add('show');
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => statusBar.classList.remove('show'), 2200);
}

function authHeaders(extra = {}) {
  return { Authorization: `Bearer ${SB_KEY}`, ...extra };
}

async function apiFetch(path, opts = {}) {
  const res = await fetch(`${SB_URL}/data/${SB_PID}/${path}`, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function relativeTime(isoStr) {
  const diff = Date.now() - new Date(isoStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1)  return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24)  return `${hrs}h ago`;
  return `${Math.floor(hrs / 24)}d ago`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderList() {
  if (!notes.length) {
    notesList.innerHTML = '<div id="empty-state">No notes yet.<br>Tap <strong>+ New</strong> to create one.</div>';
    return;
  }
  notesList.innerHTML = notes.map(n => `
    <div class="note-item${n.id === activeId ? ' active' : ''}" data-id="${n.id}">
      <div class="note-item-title">${escHtml(n.title || 'Untitled')}</div>
      <div class="note-item-date">${relativeTime(n.created_at)}</div>
    </div>
  `).join('');
  notesList.querySelectorAll('.note-item').forEach(el => {
    el.addEventListener('click', () => openNote(Number(el.dataset.id)));
  });
}

async function loadNotes() {
  try {
    const data = await apiFetch('notes?limit=100', { headers: authHeaders() });
    const raw = Array.isArray(data) ? data : (data.rows || data.data || []);
    // Normalize IDs to numbers to avoid === type mismatch
    notes = raw.map(n => ({ ...n, id: Number(n.id) }));
    renderList();
  } catch (e) {
    showStatus('Failed to load notes');
  }
}

function showEditor() {
  if (isMobile()) {
    document.body.classList.add('show-editor');
  } else {
    editorPane.style.display = 'flex';
    placeholderPane.style.display = 'none';
  }
}

function showSidebar() {
  document.body.classList.remove('show-editor');
  if (!isMobile()) {
    editorPane.style.display = 'none';
    placeholderPane.style.display = 'flex';
  }
}

function openNote(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  activeId = id;
  titleInput.value = note.title || '';
  contentArea.value = note.content || '';
  btnDelete.style.display = '';
  showEditor();
  renderList();
  contentArea.focus();
}

function newNote() {
  activeId = null;
  titleInput.value = '';
  contentArea.value = '';
  btnDelete.style.display = 'none';
  showEditor();
  renderList();
  titleInput.focus();
}

async function saveNote() {
  const title = titleInput.value.trim();
  if (!title) { titleInput.focus(); showStatus('Please add a title'); return; }
  const payload = { title, content: contentArea.value };
  btnSave.disabled = true;
  try {
    if (activeId) {
      await apiFetch(`notes/${activeId}`, {
        method: 'PATCH',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify(payload)
      });
      const note = notes.find(n => n.id === activeId);
      if (note) Object.assign(note, payload);
      showStatus('Saved');
      renderList();
    } else {
      const created = await apiFetch('notes', {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify(payload)
      });
      activeId = Number(created.id);
      btnDelete.style.display = '';
      await loadNotes();
      showStatus('Note created');
    }
  } catch (e) {
    showStatus('Save failed');
  } finally {
    btnSave.disabled = false;
  }
}

async function deleteNote() {
  if (!activeId) return;
  if (!confirm('Delete this note?')) return;
  try {
    await apiFetch(`notes/${activeId}`, { method: 'DELETE', headers: authHeaders() });
    notes = notes.filter(n => n.id !== activeId);
    activeId = null;
    showSidebar();
    renderList();
    showStatus('Deleted');
  } catch (e) {
    showStatus('Delete failed');
  }
}

// Events
btnNew.addEventListener('click', newNote);
btnSave.addEventListener('click', saveNote);
btnDelete.addEventListener('click', deleteNote);
btnBack.addEventListener('click', () => { showSidebar(); activeId = null; renderList(); });

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveNote(); }
});

// Init
btnDelete.style.display = 'none';
loadNotes();
</script>
</body>
</html>
