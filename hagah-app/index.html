<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hagah</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Hagah</h1>
  </header>

  <!-- ============ LIST VIEW ============ -->
  <main id="listView" class="view">
    <div id="notesList" class="notes-list"></div>
    <p id="listHint" class="hint centered">Loading...</p>
    <button id="addNoteBtn" class="fab" title="Add creation" aria-label="Add creation">+</button>
  </main>

  <!-- ============ EDIT VIEW ============ -->
  <main id="editView" class="view hidden">
    <div class="edit-header">
      <button id="backBtn" class="btn ghost">‹ Back</button>
      <h2 id="editTitle">New creation</h2>
      <button id="deleteNoteBtn" class="btn ghost danger hidden">Delete</button>
    </div>

    <section class="panel">
      <h3>Passage</h3>
      <div class="form-row">
        <label for="bookSelect">Book</label>
        <select id="bookSelect"></select>
      </div>
      <div class="form-row inline">
        <div>
          <label for="chapterSelect">Chapter</label>
          <select id="chapterSelect"></select>
        </div>
        <div>
          <label for="verseStart">Verse from</label>
          <input id="verseStart" type="number" min="1" value="1" />
        </div>
        <div>
          <label for="verseEnd">to (optional)</label>
          <input id="verseEnd" type="number" min="1" />
        </div>
      </div>
      <button id="addVerseBtn" class="btn primary">+ Add verse</button>

      <ul id="verseList" class="verse-list"></ul>
      <div id="combinedTextCard" class="verse-card hidden">
        <p id="combinedText" class="verse-text"></p>
      </div>
    </section>

    <section class="panel">
      <h3>Narration</h3>

      <div id="currentAudioBlock" class="subsection hidden">
        <p class="hint">Current recording</p>
        <audio id="currentAudioPlayer" controls></audio>
        <label class="loop-label"><input type="checkbox" id="currentAudioLoop" /> Loop</label>
      </div>

      <div class="subsection">
        <div class="form-row inline">
          <div>
            <label for="voiceSelect">Listen with</label>
            <select id="voiceSelect"></select>
          </div>
          <div>
            <label for="rateRange">Rate</label>
            <input id="rateRange" type="range" min="0.5" max="1.5" step="0.05" value="1" />
          </div>
        </div>
        <button id="speakBtn" class="btn">▶ Listen</button>
        <button id="stopSpeakBtn" class="btn ghost">Stop</button>
        <p class="hint">Preview only, through this device's voice — not saved.</p>
      </div>

      <div class="subsection">
        <button id="recordBtn" class="btn primary">● Record my voice</button>
        <button id="stopRecordBtn" class="btn ghost" disabled>Stop</button>
        <span id="recordStatus" class="status"></span>
        <audio id="narrationPlayer" controls class="hidden"></audio>
      </div>
    </section>

    <section class="panel">
      <h3>Background music</h3>
      <div class="form-row">
        <select id="musicChoice">
          <option value="default" selected>Meditation (default)</option>
          <option value="none">None</option>
          <option value="custom">Upload my own…</option>
        </select>
      </div>
      <input id="musicFile" type="file" accept="audio/*" class="hidden" />
      <div class="form-row inline">
        <div>
          <label for="narrationVolume">Voice volume</label>
          <input id="narrationVolume" type="range" min="0" max="1.5" step="0.05" value="1" />
        </div>
        <div>
          <label for="musicVolume">Music volume</label>
          <input id="musicVolume" type="range" min="0" max="1" step="0.05" value="0.25" />
        </div>
      </div>
      <button id="previewBtn" class="btn">▶ Preview</button>
      <button id="stopPreviewBtn" class="btn ghost">Stop</button>
      <p id="previewHint" class="hint">Record your voice above, then preview it mixed with music here.</p>
    </section>

    <section class="panel save-panel">
      <button id="saveBtn" class="btn primary big" disabled>Save</button>
      <span id="saveStatus" class="status"></span>
      <p id="saveHint" class="hint">Add a verse and narrate it to enable saving.</p>
    </section>
  </main>

  <script src="vendor/lame.min.js"></script>
  <script src="js/books.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabein.js"></script>
  <script src="js/bible.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
