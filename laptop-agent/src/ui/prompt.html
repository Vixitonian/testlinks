<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Confirm Quit — Laptop Agent</title>
<link rel="stylesheet" href="prompt.css" />
</head>
<body>
  <h1>Quit Laptop Agent?</h1>
  <p class="muted small">
    Enter the admin passphrase to quit. This prevents the monitored user
    from silently disabling the agent — it is not a substitute for the
    server-side controls once those exist.
  </p>
  <input type="password" id="pass" placeholder="Passphrase" autofocus />
  <p class="error" id="err"></p>
  <div class="actions">
    <button id="cancel" class="btn">Cancel</button>
    <button id="confirm" class="btn danger">Quit</button>
  </div>
  <script src="prompt.js"></script>
</body>
</html>
