<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Confirm — Laptop Agent</title>
<link rel="stylesheet" href="prompt.css" />
</head>
<body>
  <h1 id="title">Confirm</h1>
  <p class="muted small" id="desc"></p>
  <input type="password" id="pass" placeholder="Passphrase" autofocus />
  <p class="error" id="err"></p>
  <div class="actions">
    <button id="cancel" class="btn">Cancel</button>
    <button id="confirm" class="btn danger">Confirm</button>
  </div>
  <script src="prompt.js"></script>
</body>
</html>
