<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>History</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#16181d; --muted:#5d6470; --line:#e6e9ee;
    --accent:#3b5bdb; --accent-soft:#eef1ff; --ok:#0f7b52; --ok-soft:#e7f6ee;
    --accent-tag:#23399c; --ok-tag:#0a5a3c;
    --radius:16px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#101216;--card:#181b21;--ink:#eef0f4;--muted:#9aa2b1;--line:#282d36;
          --accent:#8fa2ff;--accent-soft:#1e2330;--ok:#5fd3a3;--ok-soft:#16261f;
          --accent-tag:#b9c6ff;--ok-tag:#8ce8c1;}
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:16px 14px 40px; background:var(--bg); color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:820px;margin:0 auto}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
        padding:14px;box-shadow:0 1px 2px rgba(16,24,40,.05)}

  .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .head h1{margin:0;font-size:17px;letter-spacing:-.01em}
  .head .count{font-size:13.5px;color:#2f3540;font-family:var(--mono)}

  .search{display:block;margin:12px 0 2px}
  .search input::placeholder{color:#3d4450;opacity:1}
  .search input{
    width:100%;min-height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line);
    background:var(--bg);color:var(--ink);font:inherit;font-size:15px;
  }
  .search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  ul.history{list-style:none;margin:6px 0 0;padding:0}
  ul.history li{border-top:1px solid var(--line)}
  ul.history li:first-child{border-top:0}
  .item{display:block;padding:14px 2px;min-height:48px;color:inherit}
  .item:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

  .subject{font-size:15px;font-weight:600;line-height:1.35;letter-spacing:-.005em;
           overflow-wrap:anywhere}
  .when{margin-top:2px;font-size:13.5px;color:#2f3540;font-family:var(--mono);
        overflow-wrap:anywhere}

  /* the two stacked identity rows inside every history entry */
  .pair{margin-top:11px;display:flex;flex-direction:column;gap:9px}
  .pair .row{display:flex;align-items:flex-start;gap:8px;min-width:0}
  .pair .tag{
    flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;border-radius:7px;
  }
  .pair .tag.repo{background:var(--accent-soft);color:var(--accent-tag);
                  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 28%,transparent)}
  .pair .tag.sb{background:var(--ok-soft);color:var(--ok-tag);
                box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ok) 28%,transparent)}
  .pair .tag svg{width:14px;height:14px;display:block}
  .pair .val{font-family:var(--mono);font-size:13px;line-height:1.5;color:var(--ink);
             min-width:0;white-space:normal;overflow-wrap:anywhere;padding-top:3px}
  .pair .val .dim{color:#2f3540}

  .empty{margin:14px 2px 2px;font-size:14px;color:var(--muted)}
  footer{margin:14px 4px 0;font-size:13.5px;color:#2f3540}
  footer code{font-family:var(--mono);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <section class="card" aria-labelledby="h-title">
    <div class="head">
      <h1 id="h-title">History</h1>
      <span class="count" id="count">—</span>
    </div>

    <label class="search">
      <input id="q" type="search" placeholder="Filter by repo, project or message…"
             autocomplete="off" aria-label="Filter history">
    </label>

    <ul class="history" id="list"></ul>
    <p class="empty" id="empty" hidden>Nothing matches that filter.</p>
  </section>

  <footer>Data from git + SupaBein · rebuild with <code>python3 build_data.py</code></footer>
</div>

<script src="data.js"></script>
<script>
(function () {
  var d = window.DASHBOARD_DATA;
  var list = document.getElementById('list');
  if (!d) {
    document.getElementById('count').textContent = 'no data';
    list.innerHTML = '<li><p class="empty">data.js is missing — run build_data.py</p></li>';
    return;
  }

  var repoLabel = d.repo.full;
  var sbLabel = d.supabein.project + ' #' + d.supabein.id;

  var ICON = {
    repo: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.2h4a1.6 1.6 0 0 1 1.6 1.6v8.4a1.2 1.2 0 0 0-1.2-1.2H2.5z"/><path d="M13.5 3.2h-4a1.6 1.6 0 0 0-1.6 1.6v8.4a1.2 1.2 0 0 1 1.2-1.2h4.4z"/></svg>',
    sb: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.2 13.6 5 8 7.8 2.4 5z"/><path d="M2.4 8 8 10.8 13.6 8"/><path d="M2.4 11 8 13.8 13.6 11"/></svg>'
  };

  function row(kind, title, value, dim) {
    var r = document.createElement('div');
    r.className = 'row';
    r.title = title;

    var t = document.createElement('span');
    t.className = 'tag ' + kind;
    t.innerHTML = ICON[kind];
    t.setAttribute('role', 'img');
    t.setAttribute('aria-label', title);

    var v = document.createElement('span');
    v.className = 'val';
    v.textContent = value;
    if (dim) {
      var s = document.createElement('span');
      s.className = 'dim';
      s.textContent = dim;
      v.appendChild(s);
    }
    r.appendChild(t);
    r.appendChild(v);
    return r;
  }

  function render(filter) {
    var f = (filter || '').trim().toLowerCase();
    var rows = d.history.filter(function (h) {
      if (!f) return true;
      return (h.subject + ' ' + h.sha + ' ' + repoLabel + ' ' + sbLabel)
        .toLowerCase().indexOf(f) !== -1;
    });

    var frag = document.createDocumentFragment();
    rows.forEach(function (h) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.className = 'item';
      a.href = d.repo.url + '/commit/' + h.sha;
      a.rel = 'noopener';
      a.setAttribute('aria-label', h.subject + ' — ' + repoLabel + ', ' + sbLabel);

      var subject = document.createElement('div');
      subject.className = 'subject';
      subject.textContent = h.subject;

      var when = document.createElement('div');
      when.className = 'when';
      when.textContent = h.date + ' · ' + h.sha +
        (h.files ? ' · ' + h.files + (h.files === 1 ? ' file' : ' files') : '');

      var pair = document.createElement('div');
      pair.className = 'pair';
      pair.appendChild(row('repo', 'Git repo', repoLabel, ' · ' + d.repo.branch));
      pair.appendChild(row('sb', 'SupaBein project', sbLabel, ''));

      a.appendChild(subject);
      a.appendChild(when);
      a.appendChild(pair);
      li.appendChild(a);
      frag.appendChild(li);
    });

    list.textContent = '';
    list.appendChild(frag);
    document.getElementById('count').textContent = rows.length + ' of ' + d.history.length;
    document.getElementById('empty').hidden = rows.length !== 0;
  }

  document.getElementById('q').addEventListener('input', function (e) {
    render(e.target.value);
  });
  render('');
})();
</script>
</body>
</html>
