<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Nigerian History Quiz</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Admin login</h1>
    <p class="subtitle">Nigerian History Quiz</p>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit" id="submit-btn">Log in</button>
      <p class="error" id="error"></p>
    </form>
    <p class="links"><a href="index.html">&larr; Back to player login</a></p>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.classList.remove("visible");
      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in...";

      try {
        await adminLogin(form.email.value.trim(), form.password.value);
        window.location.href = "admin-dashboard.html";
      } catch (err) {
        errorEl.textContent = "Invalid email or password.";
        errorEl.classList.add("visible");
        submitBtn.disabled = false;
        submitBtn.textContent = "Log in";
      }
    });
  </script>
</body>
</html>
